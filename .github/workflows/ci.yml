name: CI
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  # Allows re-running the suite from the actions tab, e.g. to re-check the
  # catalog against packagist without pushing a commit
  workflow_dispatch:

env:
  PHP_VERSION: "8.4"

jobs:
  pint:
    name: Code style
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false

    steps:
    - uses: actions/checkout@v5
    - uses: shivammathur/setup-php@v2
      with:
        php-version: ${{ env.PHP_VERSION }}
        coverage: none
    - uses: ramsey/composer-install@v3
    - name: Run Pint
      run: vendor/bin/pint --test

  pest:
    name: Tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false

    steps:
    - uses: actions/checkout@v5
    - uses: shivammathur/setup-php@v2
      with:
        php-version: ${{ env.PHP_VERSION }}
        coverage: none
    - uses: ramsey/composer-install@v3

    # The suite validates the export against the JSON schema, rejects a package
    # listed twice in one category, and checks every referenced package against
    # the list packagist publishes — which is the check that catches a typo or
    # a renamed package before it reaches the site as an empty entry.
    - name: Run Pest
      run: vendor/bin/pest
