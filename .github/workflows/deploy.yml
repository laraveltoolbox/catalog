name: Deploy
on:
  workflow_run:
    workflows: ["CI"]
    branches: ["main"]
    types:
      - completed

# Required by the deploy action to push the built catalog to the gh-pages branch
permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    # 🤷 https://github.community/t/workflow-run-completed-event-triggered-by-failed-workflow/128001
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    strategy:
      fail-fast: false

    steps:
    - uses: actions/checkout@v5
    - uses: shivammathur/setup-php@v2
      with:
        php-version: "8.4"
        coverage: none

    # Only symfony/yaml is needed to build the export; the test dependencies
    # did their job in CI.
    - uses: ramsey/composer-install@v3
      with:
        composer-options: "--no-dev"

    - name: Build catalog export
      run: php bin/export.php

    - name: Deploy 🚀
      uses: JamesIves/github-pages-deploy-action@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        branch: gh-pages # The branch the action should deploy to.
        folder: build # The folder the action should deploy.
        clean: true # Automatically remove deleted files from the deploy branch
